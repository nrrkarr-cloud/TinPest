<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalay Vebası (Tin Pest) Simülasyonu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121218;
            color: #f0f0f0;
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #canvas-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background-color: #1a1b26;
        }
        .controls {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(30, 32, 42, 0.85);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #3c4050;
            backdrop-filter: blur(5px);
            max-width: 380px;
            pointer-events: auto;
        }
        h2 { margin: 0 0 10px 0; font-size: 16px; color: #fff; }
        .temp-display { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
        .cold { color: #eb4b4b; }
        .warm { color: #4bcd78; }
        .info { font-size: 12px; color: #aaa; margin-bottom: 6px; line-height: 1.4; }
        .slider-container { margin-top: 10px; }
        input[type=range] { width: 100%; cursor: pointer; }
        button {
            margin-top: 10px;
            padding: 6px 12px;
            background: #3b4252;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover { background: #4c566a; }
    </style>
</head>
<body>

<div id="canvas-container">
    <canvas id="simCanvas" width="900" height="600"></canvas>
    <div class="controls">
        <h2>Kalay Vebası Faz Dönüşümü</h2>
        <div id="tempVal" class="temp-display warm">Sıcaklık: 20.0 °C</div>
        <div class="info"><b>Kritik Eşik:</b> 13.2 °C</div>
        <div class="info" id="phaseText"><b>Mevcut Faz:</b> Beta (β-Sn) - BCT Metalik Yapı</div>
        <div class="info" id="densityText"><b>Yoğunluk:</b> 7.31 g/cm³</div>
        <div class="info" id="progressText"><b>Dönüşüm Oranı:</b> %0.0</div>
        
        <div class="slider-container">
            <label for="tempSlider" class="info">Sıcaklığı Ayarla (-30°C ile 40°C):</label>
            <input type="range" id="tempSlider" min="-30" max="40" value="20" step="0.5">
        </div>
        <button onclick="resetSimulation()">Simülasyonu Sıfırla</button>
    </div>
</div>

<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

let temperature = 20.0;
let atoms = [];
const rows = 12;
const cols = 12;
const spacing = 24;
const centerX = canvas.width / 2;
const centerY = canvas.height / 2;

class Atom {
    constructor(x, y) {
        this.baseX = x;
        this.baseY = y;
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.phaseProgress = 0.0; // 0.0 (Beta) -> 1.0 (Alpha)
        this.fractured = false;
    }

    update(temp, dt) {
        // Phase transition mechanics below 13.2 C
        if (temp < 13.2 && !this.fractured) {
            let rate = (13.2 - temp) * 0.008;
            this.phaseProgress = Math.min(1.0, this.phaseProgress + rate * dt);
        } else if (temp >= 13.2 && !this.fractured) {
            this.phaseProgress = Math.max(0.0, this.phaseProgress - 0.02 * dt);
        }

        // Volume expansion (~27% expansion)
        let expansion = 1.0 + (this.phaseProgress * 0.27);
        
        // Thermal noise
        let noise = Math.max(0.1, (temp + 40) * 0.015);
        let nx = (Math.random() - 0.5) * noise;
        let ny = (Math.random() - 0.5) * noise;

        if (!this.fractured) {
            let dx = this.baseX - centerX;
            let dy = this.baseY - centerY;
            this.x = centerX + dx * expansion + nx;
            this.y = centerY + dy * expansion + ny;

            // Crack propagation / pulverization
            if (this.phaseProgress > 0.8 && Math.random() < 0.015) {
                this.fractured = true;
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 2 + 0.5;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
            }
        } else {
            // Brittle powder particle physics
            this.x += this.vx;
            this.y += this.vy;
            this.vy += 0.04; // mild gravity
            if (this.y > canvas.height - 40) {
                this.y = canvas.height - 40;
                this.vx *= 0.5;
                this.vy = 0;
            }
        }
    }

    draw() {
        // Color transition: White Metallic -> Dark Gray Semiconductor
        let r = Math.round(200 + (100 - 200) * this.phaseProgress);
        let g = Math.round(220 + (105 - 220) * this.phaseProgress);
        let b = Math.round(240 + (115 - 240) * this.phaseProgress);
        
        ctx.beginPath();
        let radius = this.phaseProgress > 0.5 ? 6 : 4.5;
        ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgb(${r},${g},${b})`;
        ctx.fill();
        ctx.closePath();
    }
}

function initLattice() {
    atoms = [];
    let startX = centerX - (cols * spacing) / 2;
    let startY = centerY - (rows * spacing) / 2;

    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            atoms.push(new Atom(startX + c * spacing, startY + r * spacing));
        }
    }
}

function resetSimulation() {
    initLattice();
    document.getElementById('tempSlider').value = 20;
    temperature = 20.0;
}

document.getElementById('tempSlider').addEventListener('input', (e) => {
    temperature = parseFloat(e.target.value);
});

let lastTime = performance.now();

function animate(currentTime) {
    let dt = (currentTime - lastTime) / 1000;
    lastTime = currentTime;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Update & UI Texts
    const tempDisp = document.getElementById('tempVal');
    tempDisp.innerText = `Sıcaklık: ${temperature.toFixed(1)} °C`;
    if (temperature < 13.2) {
        tempDisp.className = 'temp-display cold';
        document.getElementById('phaseText').innerHTML = '<b>Mevcut Faz:</b> Alfa (α-Sn) - Elmas Kubik (Gevrek)';
        document.getElementById('densityText').innerHTML = '<b>Yoğunluk:</b> 5.77 g/cm³ (%27 Genleşme)';
    } else {
        tempDisp.className = 'temp-display warm';
        document.getElementById('phaseText').innerHTML = '<b>Mevcut Faz:</b> Beta (β-Sn) - BCT Metalik Yapı';
        document.getElementById('densityText').innerHTML = '<b>Yoğunluk:</b> 7.31 g/cm³ (Kararlı Metal)';
    }

    let totalProgress = 0;

    // Draw Bonds
    for (let i = 0; i < atoms.length; i++) {
        let a1 = atoms[i];
        totalProgress += a1.phaseProgress;
        a1.update(temperature, dt);

        if (a1.fractured) continue;

        for (let j = i + 1; j < atoms.length; j++) {
            let a2 = atoms[j];
            if (a2.fractured) continue;

            let dist = Math.hypot(a1.x - a2.x, a1.y - a2.y);
            if (dist < 30) {
                let alpha = 1.0 - ((a1.phaseProgress + a2.phaseProgress) / 2);
                ctx.beginPath();
                ctx.moveTo(a1.x, a1.y);
                ctx.lineTo(a2.x, a2.y);
                ctx.strokeStyle = `rgba(140, 160, 190, ${alpha * 0.4})`;
                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }
    }

    // Draw Atoms
    atoms.forEach(atom => atom.draw());

    let avgProgress = (totalProgress / atoms.length) * 100;
    document.getElementById('progressText').innerHTML = `<b>Dönüşüm Oranı:</b> %${avgProgress.toFixed(1)}`;

    requestAnimationFrame(animate);
}

initLattice();
requestAnimationFrame(animate);
</script>

</body>
</html>
